<!DOCTYPE html>
<html>
<head>
    <title>AJAX Static</title>
</head>
<body>

<h1>Message:</h1>
<p id="output"></p>

<script>
    fetch('/static/message.json')
        .then(response => response.json())
        .then(data => {
            document.getElementById('output').innerText = data.message;
        })
        .catch(error => console.error(error));
</script>

</body>
</html>
