<!DOCTYPE html>
<html>
<head>
    <title>AJAX Periodic</title>
</head>
<body>

<h1>Live Message:</h1>
<p id="output"></p>

<script>
    function loadMessage() {
        fetch('/static/message.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('output').innerText = data.message;
            });
    }

    // load every 3 seconds
    setInterval(loadMessage, 3000);

    // first call immediately
    loadMessage();
</script>

</body>
</html>
